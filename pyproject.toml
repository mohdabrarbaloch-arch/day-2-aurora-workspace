[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    # Formatter's job, not the linter's.
    "E501",
    # FastAPI's Depends() in default arguments is the documented pattern.
    "B008",
    # Prose in docstrings and comments is written for humans: typographic
    # characters (\u00d7, \u2014, ") are correct there, not linter defects.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
